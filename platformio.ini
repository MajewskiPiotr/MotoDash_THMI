[platformio]
packages_dir = C:\pio\packages
platforms_dir = C:\pio\platforms

[env:lilygo-t-hmi]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Ustawienia pamięci dla modułu ESP32-S3R8 (16MB Flash / 8MB OPI PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    mathertel/OneButton@^2.5.0
    XPT2046_Touchscreen
    
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_WR=8
    -DTFT_RD=-1
    -DTFT_RST=-1
    -DTFT_D0=48
    -DTFT_D1=47
    -DTFT_D2=39
    -DTFT_D3=40
    -DTFT_D4=41
    -DTFT_D5=42
    -DTFT_D6=45
    -DTFT_D7=46
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

